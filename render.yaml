# Render · servidor de CONTROL del celular (WebSocket). La presentación se publica aparte, estática, en Hostinger.
# No sirve la web: solo /salud, /api/sesiones, /ws y las redirecciones /r/<id> de los QR.
# ALLOWED_ORIGINS = el dominio exacto donde está la presentación (ej. https://pitch.handyc.com). Sin barra final.
services:
  - type: web
    name: handyx-control
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node server/main.ts
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: CONFIAR_PROXY
        value: "true"
      - key: QR_REDIRECCIONES
        value: decks/handyx/qr.json
      - key: ALLOWED_ORIGINS
        sync: false
